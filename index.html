<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Data Operations Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        /* Surfaces */
        --bg:           #F5F4F2;
        --surface:      #FFFFFF;
        --surface-2:    #FAFAF9;
        --border:       #E4E1DC;
        --divider:      #F0EDE9;

        /* Accent — Anthropic orange */
        --accent:       #C4511A;
        --accent-lt:    #FDF2EC;
        --accent-mid:   #D4622A;

        /* Text hierarchy */
        --txt:          #1C1917;
        --txt-2:        #57534E;
        --txt-3:        #A8A29E;
        --txt-4:        #D6D3D1;

        /* Status palette — used sparingly */
        --red:          #DC2626;
        --red-lt:       #FEF2F2;
        --red-border:   #FECACA;
        --amber:        #B45309;
        --amber-lt:     #FFFBEB;
        --amber-border: #FDE68A;
        --green:        #15803D;
        --green-lt:     #F0FDF4;
        --green-border: #BBF7D0;
        --blue:         #1D4ED8;
        --blue-lt:      #EFF6FF;
        --blue-border:  #BFDBFE;

        /* Urgency dots — the single source of urgency color */
        --dot-critical: #DC2626;
        --dot-high:     #D97706;
        --dot-medium:   #9CA3AF;
        --dot-low:      #D4D4D8;

        /* Shadows — only for floating elements (modals, toasts) */
        --shadow-sm:    none;
        --shadow-md:    0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);

        --radius:       8px;
        --radius-sm:    6px;
        --radius-xs:    4px;
        --transition:   160ms ease;

        /* Legacy aliases kept for backward compat */
        --orange:       #C4511A;
        --orange-lt:    #FDF2EC;
        --orange-mid:   #D4622A;
        --critical:     #DC2626;
        --crit-lt:      #FEF2F2;
        --warn:         #B45309;
        --warn-lt:      #FFFBEB;
        --ok:           #15803D;
        --ok-lt:        #F0FDF4;
        --info:         #1D4ED8;
        --info-lt:      #EFF6FF;
        --border-mid:   #D6D3D1;
      }

      html, body, #root {
        height: 100%;
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--txt);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        outline: none;
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
